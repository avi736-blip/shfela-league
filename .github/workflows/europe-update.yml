name: europe-update-games
on:
  schedule:
    - cron: "17 5,17 * * *"   # twice a day (08:17 / 20:17 Israel time)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: europe-update-games
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python europe/scripts/geocode.py
      - run: python europe/scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "games-bot"
          git config user.email "games-bot@users.noreply.github.com"
          git add europe/data/games.json europe/data/coords.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "europe: auto update results, kickoff times and map"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
