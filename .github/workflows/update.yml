name: update-league
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: self-hosted
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade playwright
      - run: python -m playwright install chromium
      - run: python scrape.py
      - run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "auto update"; git push }
