name: europe-probe-home
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PROBE_PAGES: probe_pages_home.json
      PROBE_OUT: probe_home
      PROBE_CHANNEL: chrome
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade playwright
      - run: python -m playwright install chromium
      - run: python europe/scripts/probe_browser.py
      - run: |
          git config user.name "games-bot"
          git config user.email "games-bot@users.noreply.github.com"
          git add europe/debug/probe_home
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "europe: home probe samples"; git pull --rebase; git push }
